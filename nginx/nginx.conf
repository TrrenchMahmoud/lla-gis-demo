server {
    listen 80;
    resolver 127.0.0.11 valid=10s;
    root /usr/share/nginx/html;
    index index.html;

    location / { try_files $uri $uri/ /index.html; }

    location /api/ {
        # Default is 1MB, which a shapefile .zip upload (admin data-upload feature) blows
        # straight through - 200MB covers a large parcel dataset with room to spare.
        client_max_body_size 200M;
        set $api_up http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_up;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /_auth {
        internal;
        set $auth_up http://backend:8000;
        proxy_pass $auth_up/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;
    }

    location /tiles/ {
        auth_request /_auth;
        set $tiles_up http://pg_tileserv:7800;
        rewrite ^/tiles/(.*)$ /$1 break;
        proxy_pass $tiles_up;
        proxy_set_header Host $host;
    }
    location /features/ {
        auth_request /_auth;
        set $feat_up http://pg_featureserv:9000;
        rewrite ^/features/(.*)$ /$1 break;
        proxy_pass $feat_up;
        proxy_set_header Host $host;
    }
}
